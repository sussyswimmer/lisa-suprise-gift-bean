name: Build Bean DMG (test)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check
      - name: Build Accessibility helper
        run: |
          npm run build:helper
          npm run build:helper -- ${{ matrix.target }}
      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build signed-disabled DMG
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx tauri
          projectPath: ./src-tauri
          args: --target ${{ matrix.target }}
      - name: Verify bundled Accessibility helper
        shell: bash
        run: |
          helper="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Bean.app/Contents/MacOS/bean-claude-observer"
          test -x "$helper"
          "$helper" --self-test
      - name: Emit checksums
        run: |
          shasum -a 256 src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg > \
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/sha256-${{ matrix.target }}.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bean-${{ matrix.target }}-dmg
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/sha256-${{ matrix.target }}.txt

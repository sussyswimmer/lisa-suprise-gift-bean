name: Build Bean DMG (test)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build frontend bundle
        run: npm run build
      - name: Build Accessibility helper
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) swift_target="arm64-apple-macosx14.0" ;;
            x86_64-apple-darwin) swift_target="x86_64-apple-macosx14.0" ;;
          esac
          swiftc -O \
            -target "$swift_target" \
            -framework ApplicationServices \
            -framework Foundation \
            -framework AppKit \
            src-tauri/helpers/bean-claude-observer/Sources/main.swift \
            -o "src-tauri/helpers/bean-claude-observer-${{ matrix.target }}"
          chmod +x "src-tauri/helpers/bean-claude-observer-${{ matrix.target }}"
      - name: Build signed-disabled DMG
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx tauri
          projectPath: ./src-tauri
          args: --target ${{ matrix.target }}
      - name: Emit checksums
        run: |
          shasum -a 256 src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg > \
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/sha256-${{ matrix.target }}.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bean-${{ matrix.target }}-dmg
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/sha256-${{ matrix.target }}.txt

name: Build Bean DMG (test)

on:
  push:
    branches: [main]
    # Pushing a v* tag also publishes both DMGs as a GitHub pre-release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check
      - name: Build Accessibility helper
        run: |
          npm run build:helper
          npm run build:helper -- ${{ matrix.target }}
      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build signed-disabled DMG
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx tauri
          projectPath: ./src-tauri
          args: --target ${{ matrix.target }}
      - name: Verify bundled Accessibility helper
        shell: bash
        run: |
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            scripts/verify-dmg.sh "$dmg"
          done
      - name: Emit checksums
        run: |
          shasum -a 256 src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg > \
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/sha256-${{ matrix.target }}.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bean-${{ matrix.target }}-dmg
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/sha256-${{ matrix.target }}.txt
      - name: Publish release downloads
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            title=$(sed -n '1s/^# *//p' "$notes")
            tail -n +2 "$notes" > "$RUNNER_TEMP/notes.md"
          else
            title="Bean ${GITHUB_REF_NAME}"
            : > "$RUNNER_TEMP/notes.md"
          fi
          # Both matrix jobs publish to the same release; whichever finishes
          # first creates it.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
              --title "$title" --notes-file "$RUNNER_TEMP/notes.md" ||
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "$dmg_dir"/*.dmg \
            "$dmg_dir/sha256-${{ matrix.target }}.txt" --clobber
